[project]
name = "emmyptx"
version = "1.0.0"
description = "A compiler from Emmy Kernel IR to NVIDIA PTX"
requires-python = ">=3.12"
dependencies = ["emmy-ml==0.3.11"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/variants.py" = ["E501"]
